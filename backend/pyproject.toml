[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neuropathy-app-backend"
version = "0.1.0"
description = "Backend for the neuropathy app — ingest (BioMech, labs, ADL), graph, and AI health-trajectory analysis."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-multipart>=0.0.9",       # file uploads (lab PDFs, BioMech reports)
    "pypdf>=5.1",                    # BioMech report PDF text extraction (BSD-3-Clause);
                                 # >=5.1 for its decompression-output limits (ADR-0014)
    "httpx>=0.27",                   # EMR transport (BSD)
    "pyjwt[crypto]>=2.8",            # SMART Backend Services client assertion (MIT)
    "google-auth>=2.28",             # FCM HTTP v1 OAuth2 token mint, ADR-0047 B2
                                 # (Apache-2.0 — already allowlisted). Its only new
                                 # transitive deps are pyasn1 / pyasn1-modules (BSD),
                                 # both already covered by the ci.yml allowlist string;
                                 # it reuses cryptography (already a direct dep) to sign.
    "cryptography>=42",              # Fernet encryption for the DB token vault, ADR-0017
                                 # (Apache-2.0 OR BSD-3-Clause; was already a transitive
                                 # dep via pyjwt[crypto], now a direct import)
    "argon2-cffi>=23.1",             # password hashing, Argon2id (MIT)
    "email-validator>=2.1",          # pydantic EmailStr (CC0/Unlicense)
    "prometheus-client>=0.20",       # PHI-free Prometheus /metrics exposition, ADR-0021
                                 # (Apache-2.0 AND BSD-2-Clause — both permissive; no
                                 # transitive deps). Allowlist string added in ci.yml.
    "gunicorn>=22.0",                # prod server: supervises uvicorn workers so its
                                 # child_exit hook runs the prometheus multiprocess
                                 # worker-death cleanup (ADR-0021). MIT; its one dep
                                 # `packaging` (Apache-2.0 OR BSD-2-Clause) is already
                                 # resolved in the tree — both strings already allowlisted.
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

# Only `app` is the importable package; `alembic` is migration scripts, not shipped.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Professional baseline: pycodestyle, pyflakes, isort, bugbear, comprehensions,
# pyupgrade, simplify, naming. Zero warnings tolerated (see standards.md).
select = ["E", "F", "I", "B", "C4", "UP", "SIM", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# SQLAlchemy's declarative attributes need its plugin; keep models strict otherwise.
module = "app.models.*"
disallow_any_explicit = false

[[tool.mypy.overrides]]
# google-auth ships no type information (no py.typed): its Credentials/JWT helpers are
# untyped, so a strict typed context flags the calls. Scope the relaxation to the one
# module that imports it (the FCM sender); the rest of the app stays fully strict.
module = "app.services.push"
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=85 -q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
# The 85% gate measures logic we unit-test. Declarative ORM models and DB wiring carry
# no branching logic and are covered by integration tests (added when CI gets a Postgres
# service), not unit coverage — excluding them keeps the gate meaningful, not inflated.
omit = [
    "app/main.py",
    "app/db/*",
    "app/models/*",
    "alembic/*",
    "*/__init__.py",
    # Postgres repository implementations only run against a real database; the
    # integration suite (tests/integration/, Postgres service in CI) exercises them.
    # Unit coverage measures the storage-agnostic logic they share with the in-memory
    # implementations.
    "app/repositories/postgres.py",
]

# All dependencies above are permissively licensed (MIT/BSD/Apache) per CLAUDE.md §4.
