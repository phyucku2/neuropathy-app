ext {
    minSdkVersion = 22
    // Play requires new apps to target API 35 (Android 15) as of Aug 2025, rising to API 36
    // on 2026-08-31. compileSdk tracks targetSdk. minSdk stays low for device reach. A move
    // to API 36 (likely via a Capacitor 7 upgrade) is the follow-up before the Aug-2026 date.
    compileSdkVersion = 35
    targetSdkVersion = 35
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    // Firebase Cloud Messaging (ADR-0047 B2): pin the version @capacitor/push-notifications
    // resolves for `com.google.firebase:firebase-messaging` (its build.gradle reads this ext,
    // else falls back to its own default) so CI and release builds compile a fixed version
    // rather than a floating one. firebase-messaging COMPILES without google-services.json —
    // that file is only consumed at build time by the google-services plugin (applied
    // conditionally in app/build.gradle) to generate the google_app_id resource — so the
    // mobile CI `assembleDebug` job stays green with no google-services.json present.
    firebaseMessagingVersion = '23.4.1'
}