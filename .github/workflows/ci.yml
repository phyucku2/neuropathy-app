name: CI

on:
  pull_request:
  push:
    branches: [main]

# Enforces docs/engineering/standards.md. Failing checks block merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway Postgres for the integration suite (tests/integration/). The
      # credentials are CI-ephemeral service config, not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuropathy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Presence of TEST_DATABASE_URL activates tests/integration/ (they skip
      # cleanly without it, e.g. on a laptop with no Postgres running).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropathy_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy (strict)
        run: python -m mypy app

      - name: Tests + coverage (fails under 85%; includes Postgres integration suite)
        run: python -m pytest

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript (strict)
        run: npx tsc --noEmit

      - name: ESLint (zero warnings)
        run: npx eslint . --max-warnings 0

      - name: Prettier check
        run: npx prettier --check .

      - name: Tests + coverage (fails under 90% lines/branches)
        run: npx vitest run --coverage

      - name: Production build
        run: npx vite build

  # ALL scan steps in this job BLOCK the merge (ADR-0017): the Python
  # vulnerability audit and license allowlist, the frontend npm audit and
  # license allowlist, and the secret scan. The Python steps resolve the real
  # dependency tree by installing the backend into an isolated venv, then scan
  # that environment — pip-audit could never parse our pyproject directly.
  security:
    name: Security & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend into an isolated scan environment
        # A dedicated venv so the scans judge OUR dependency tree, not the scan
        # tools' own dependencies.
        run: |
          python -m venv /tmp/scan-env
          /tmp/scan-env/bin/pip install --upgrade pip
          /tmp/scan-env/bin/pip install -e ./backend

      # Both scan tools live OUTSIDE the scan env (the runner's default python) and
      # judge it from there, so their own dependencies are never part of the scanned
      # tree. Allowlist per CLAUDE.md §4 (permissive only), spelled the way the
      # resolved tree spells them (SPDX ids + classifier strings + the PSF/Unlicense
      # variants). certifi is skipped by name: it is the Mozilla CA certificate
      # bundle (MPL-2.0) consumed unmodified as data — the one reviewed exception,
      # recorded in ADR-0017.
      - name: License policy (Python — blocking allowlist)
        run: |
          pip install pip-licenses
          pip-licenses --python /tmp/scan-env/bin/python \
            --ignore-packages neuropathy-app-backend certifi \
            --allow-only "MIT;MIT License;MIT-0;MIT AND PSF-2.0;BSD License;BSD-2-Clause;BSD-3-Clause;Apache Software License;Apache-2.0;Apache-2.0 OR BSD-2-Clause;Apache-2.0 OR BSD-3-Clause;ISC License (ISCL);PSF-2.0;The Unlicense (Unlicense)"

      # pip-audit mirrors the pip-licenses approach: installed OUTSIDE the scan env
      # and pointed at a fully pinned freeze snapshot of it, so pip-audit's own ~26
      # dependencies (requests, rich, urllib3, ...) never join the audited set and
      # cannot gate merges. --exclude-editable drops only our own unpublished
      # package (never on PyPI); every real dependency is audited and any known
      # vulnerability fails CI. --no-deps is safe because the snapshot IS the fully
      # resolved tree — there is nothing left to resolve.
      - name: Dependency vulnerability audit (Python — blocking)
        run: |
          pip install pip-audit
          /tmp/scan-env/bin/pip freeze --exclude-editable > /tmp/scan-freeze.txt
          pip-audit -r /tmp/scan-freeze.txt --no-deps

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm vulnerability audit (production tree, blocking on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm license allowlist (production tree, blocking)
        working-directory: frontend
        # --excludePrivatePackages skips only our own unpublished root package.
        run: npx license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;OFL-1.1;CC0-1.0;Unlicense;BlueOak-1.0.0"

      - name: Secret scan (tracked files)
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']+)' -- . ':!*.md'; then
            echo "::error::Possible secret committed"; exit 1
          fi
          echo "No obvious secrets found."
