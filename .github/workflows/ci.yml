name: CI

on:
  pull_request:
  push:
    branches: [main]

# Enforces docs/engineering/standards.md. Failing checks block merge.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Throwaway Postgres for the integration suite (tests/integration/). The
      # credentials are CI-ephemeral service config, not secrets.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: neuropathy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Presence of TEST_DATABASE_URL activates tests/integration/ (they skip
      # cleanly without it, e.g. on a laptop with no Postgres running).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/neuropathy_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: python -m ruff check .

      - name: Ruff format check
        run: python -m ruff format --check .

      - name: mypy (strict)
        run: python -m mypy app

      - name: Tests + coverage (fails under 85%; includes Postgres integration suite)
        run: python -m pytest

  frontend:
    name: Frontend — types, lint, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: TypeScript (strict)
        run: npx tsc --noEmit

      - name: ESLint (zero warnings)
        run: npx eslint . --max-warnings 0

      - name: Prettier check
        run: npx prettier --check .

      - name: Tests + coverage (fails under 90% lines/branches)
        run: npx vitest run --coverage

      - name: Production build
        run: npx vite build

  # Blocking for the frontend npm tree (vulnerability audit + license
  # allowlist) and for the secret scan. The Python pip-audit / pip-licenses
  # steps are still NON-BLOCKING placeholders (deps not pinned yet) — making
  # them blocking belongs to the hardening pass (docs/roadmap-status.md).
  security:
    name: Security & license scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependency vulnerability audit (Python — placeholder, non-blocking)
        run: |
          pip install pip-audit
          pip-audit -r backend/pyproject.toml || pip-audit --skip-editable . || true
        # Non-blocking today (no locked deps yet); tighten to blocking once deps are pinned.

      - name: License policy (Python — placeholder, informational)
        run: |
          pip install pip-licenses || true
          echo "License gate placeholder — enforce MIT/BSD/Apache/ISC once deps are installed in this job."

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm vulnerability audit (production tree, blocking on high/critical)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

      - name: npm license allowlist (production tree, blocking)
        working-directory: frontend
        # --excludePrivatePackages skips only our own unpublished root package.
        run: npx license-checker-rseidelsohn --production --excludePrivatePackages --onlyAllow "MIT;Apache-2.0;ISC;BSD-2-Clause;BSD-3-Clause;0BSD;OFL-1.1;CC0-1.0;Unlicense;BlueOak-1.0.0"

      - name: Secret scan (tracked files)
        run: |
          if git grep -nE '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|password\s*=\s*["'"'"'][^"'"'"']+)' -- . ':!*.md'; then
            echo "::error::Possible secret committed"; exit 1
          fi
          echo "No obvious secrets found."
