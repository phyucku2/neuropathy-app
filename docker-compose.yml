# Staging / development topology (ADR-0018). NOT a hardened production deployment:
# no TLS termination, no secret manager, no backups, no autoscaling, single Postgres.
# Production hardening (managed Postgres, a real gateway/TLS, centralized logging &
# metrics, secret rotation) is the ops/observability portions, not this file.
#
# All config comes from the environment: copy .env.example to .env and fill it in
# (`.env` is gitignored). This file references ${VARS} only — never committed secrets.
#
# Migration-before-boot rule (files-only migrations, backend/README.md): the one-shot
# `migrate` service runs `alembic upgrade head` and must complete before `backend`
# starts. The app never migrates its own schema.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV}
      APP_DEBUG: ${APP_DEBUG}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      SECRET_STORE_KEY: ${SECRET_STORE_KEY}
      OPS_BOOTSTRAP_TOKEN: ${OPS_BOOTSTRAP_TOKEN}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    environment:
      # Empty = same-origin: nginx reverse-proxies the API to the backend service.
      API_BASE_URL: ${API_BASE_URL}
      BACKEND_ORIGIN: backend:8000
    ports:
      - "${FRONTEND_PORT}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
